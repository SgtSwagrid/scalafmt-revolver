name: Linter

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

# Cancel in-progress runs when starting a new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}
          path: repo

      # The action as of this repository's own pull request when it runs on one,
      # so that a change to it is tried before it is merged, or else of `main`.
      - name: Checkout scalafmt-revolver
        uses: actions/checkout@v4
        with:
          repository: SgtSwagrid/scalafmt-revolver
          path: scalafmt-revolver

      # Checks the formatting, and fixes it if need be (see `action.yml`):
      # by a commit to a pull request, or else by a pull request of its own.
      - name: Lint
        uses: ./scalafmt-revolver
        with:
          token: ${{ secrets.GH_TOKEN }}
          directory: repo
